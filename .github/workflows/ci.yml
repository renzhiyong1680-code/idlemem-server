name: ci

on:
  push:
    branches: [master, main]
    # 出包 job 由 tag 触发，必须显式列出 tags，否则推 tag 不会启动工作流
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 核心库按版本号从模块代理拉取，本 job 只需检出本仓库。
      - name: checkout server
        uses: actions/checkout@v4
        with:
          path: src/idlemem-server
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/idlemem-server/go.mod
          cache-dependency-path: src/idlemem-server/go.sum

      - name: vet
        working-directory: src/idlemem-server
        run: go vet ./...

      - name: test
        working-directory: src/idlemem-server
        run: go test ./... -count=1

      - name: build
        working-directory: src/idlemem-server
        run: go build ./...

  release:
    # 只在打 tag 时出包，日常提交不产生产物。
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: checkout server
        uses: actions/checkout@v4
        with:
          path: src/idlemem-server
      # 出包时要额外编译核心库里的 agent 二进制，所以仍需要 core 源码目录。
      - name: checkout core
        uses: actions/checkout@v4
        with:
          repository: renzhiyong1680-code/idlemem-core
          path: src/idlemem-core
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/idlemem-server/go.mod
          cache-dependency-path: src/idlemem-server/go.sum

      - name: cross compile and checksum
        working-directory: src/idlemem-server
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          OUT="dist"
          mkdir -p "$OUT"

          build() {
            comp="$1"; pkg="$2"; os="$3"; arch="$4"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            name="${comp}_${VERSION}_${os}_${arch}${ext}"
            echo "building $name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$OUT/$name" "$pkg"
          }

          # agent 属于核心库模块，进 core 目录单独构建，产物落到本仓库 dist
          build_agent() {
            os="$1"; arch="$2"
            ext=""
            if [ "$os" = "windows" ]; then ext=".exe"; fi
            name="agent_${VERSION}_${os}_${arch}${ext}"
            echo "building $name"
            out="$PWD/$OUT/$name"
            ( cd ../idlemem-core && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
              go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out" ./cmd/xiancun-agent )
          }

          # 三个程序 × 五个平台 = 15 个产物
          for target in linux_amd64 linux_arm64 windows_amd64 darwin_amd64 darwin_arm64; do
            os="${target%%_*}"
            arch="${target##*_}"
            build server ./cmd/server "$os" "$arch"
            build cli ./cmd/xiancun-cli "$os" "$arch"
            build_agent "$os" "$arch"
          done

          cd "$OUT"
          # 先排除校验文件本身，否则 sha256sum 会把刚创建的空 SHA256SUMS 也算进去
          sha256sum $(ls -1 | grep -vx SHA256SUMS) > SHA256SUMS
          echo "=== artifacts"
          ls -1
          echo "=== checksums"
          cat SHA256SUMS

      - name: upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xiancun-${{ github.ref_name }}
          path: src/idlemem-server/dist
